services:
  - type: web
    name: ai-crypto-advisor-server
    runtime: node
    rootDir: server
    healthCheckPath: /api/health
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEWSDATA_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false